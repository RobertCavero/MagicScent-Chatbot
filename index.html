<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Scent Chatbot</title>
  <style>
    
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* evita scroll horizontal por sombras */
    }
    /* Corpo da página com fundo escuro e gradiente */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      color: #fff;
      padding-bottom: 20px;
    }

    header {
      width: 100%;
      padding: 40px 20px 20px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
      color: #fff;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    }

    .chatbot-container {
      width: 95%;
      max-width: 900px;
      height: 600px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 50px;
      background-color: #000; 
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.8rem;
      }
      .chatbot-container {
        height: 500px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Bem-vindo ao Chatbot da Magic Scent!</h1>
  </header>

  <div class="chatbot-container">
    <iframe
    src="https://typebot.co/chat3-beta-1-ctlhph5"
    style="border: none; width: 100%; height: 600px"
    ></iframe>

  </div>
</body>
</html>
